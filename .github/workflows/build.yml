name: Build & Release Windows Setup

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Application and Setup
        run: npm run build:setup

      - name: Upload Setup Artifact (Geçici İndirme)
        uses: actions/upload-artifact@v4
        with:
          name: ETIBOL_POS_Setup
          path: dist/ETIBOL_POS_Setup_2.0.1.exe

      - name: Create GitHub Release (2.0.1 Sürümü Oluştur)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.1
          name: ETİBOL POS v2.0.1
          draft: false
          prerelease: false
          files: dist/ETIBOL_POS_Setup_2.0.1.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
