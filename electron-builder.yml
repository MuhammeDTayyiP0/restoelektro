# Electron Builder paketleme yapılandırması
appId: com.etibol.pos
productName: ETİBOL POS
copyright: Copyright © 2024 ETİBOL POS

directories:
  buildResources: resources
  output: dist

files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.*'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'

# Native modüller için asar arşivleme ayarı
asarUnpack:
  - '**/*.{node,dll}'
  - node_modules/better-sqlite3/**
  - node_modules/serialport/**

# Windows yapılandırması
win:
  target:
    - target: dir
  icon: resources/icon.ico
  artifactName: '${productName}-${version}-${arch}.${ext}'

publish:
  - provider: github
    owner: MuhammeDTayyiP0
    repo: restoelektro



# Linux yapılandırması (opsiyonel)
linux:
  target:
    - AppImage
  category: Office
